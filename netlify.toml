# Netlify hosts the built React app. The API and uploaded images stay on Render.
# Netlify proxies /api/* and /uploads/* to Render (status 200 = proxy, not redirect),
# so the browser only ever talks to the Netlify domain: the httpOnly session cookie
# stays first-party and no CORS setup is needed.
[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://shuka-ztee.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://shuka-ztee.onrender.com/uploads/:splat"
  status = 200
  force = true

# React Router: every other path serves the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
